name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  packages: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # ========================================
  # Create GitHub Release
  # ========================================
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.get_version.outputs.VERSION }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Generate changelog
        id: changelog
        run: |
          git log --pretty=format:"- %s" $(git rev-list --tags --max-count=1)..HEAD > /tmp/changelog.txt

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          name: Vortex Atoms AI ${{ steps.get_version.outputs.VERSION }}
          body_path: /tmp/changelog.txt
          draft: false
          prerelease: false

  # ========================================
  # Build and Upload Binaries
  # ========================================
  build-binaries:
    name: Build Binary (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: create-release
    permissions:
      contents: write
      id-token: write
      attestations: write

    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            suffix: linux-amd64
          - os: macos-latest
            target: x86_64-apple-darwin
            suffix: macos-amd64
          - os: macos-latest
            target: aarch64-apple-darwin
            suffix: macos-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            suffix: windows-amd64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-multilib

      - name: Build release binary (with embedded SBOM)
        run: |
          cargo build --release --bin vortex_api

      - name: Package binary (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          cd target/release
          tar czvf vortex-atoms-ai-${{ matrix.suffix }}.tar.gz vortex_api

      - name: Package binary (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          cd target/release
          7z a vortex-atoms-ai-${{ matrix.suffix }}.zip vortex_api.exe

      - name: Upload Release Asset (Unix)
        if: matrix.os != 'windows-latest'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ github.ref_name }} target/release/vortex-atoms-ai-${{ matrix.suffix }}.tar.gz --clobber

      - name: Upload Release Asset (Windows)
        if: matrix.os == 'windows-latest'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ github.ref_name }} target/release/vortex-atoms-ai-${{ matrix.suffix }}.zip --clobber

      - name: Publish checksums + SLSA provenance
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd target/release
          sha256sum vortex-atoms-ai-${{ matrix.suffix }}.* > sha256sums-${{ matrix.suffix }}.txt
          cat sha256sums-${{ matrix.suffix }}.txt
          gh release upload ${{ github.ref_name }} sha256sums-${{ matrix.suffix }}.txt --clobber
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: target/release/vortex-atoms-ai-${{ matrix.suffix }}.*

  # ========================================
  # Build and Push Docker Image
  # ========================================
  docker:
    name: Docker Push
    runs-on: ubuntu-latest
    needs: create-release

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/vortex-atoms-ai
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ========================================
  # Attach Verification Artifacts (small files only)
  # ========================================
  verification:
    name: Attach Verification Artifacts
    runs-on: ubuntu-latest
    needs: [create-release, build-binaries]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate SHA256 manifest
        run: |
          echo "# SHA-256 Manifest — ${{ github.ref_name }}" > SHA256_MANIFEST.txt
          echo "# Generated: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> SHA256_MANIFEST.txt
          echo "" >> SHA256_MANIFEST.txt
          for f in SBOM.json provenance.json docs/SEC01_LANDING.md; do
            if [ -f "$f" ]; then
              sha256sum "$f" >> SHA256_MANIFEST.txt
            fi
          done
          cat SHA256_MANIFEST.txt

      - name: Attach verification artifacts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ github.ref_name }} \
            SHA256_MANIFEST.txt \
            SBOM.json \
            provenance.json \
            docs/SEC01_LANDING.md \
            --clobber
